{% extends "base.html" %}

{% block title %}Login — SmartQA Store{% endblock %}

{% block content %}
<div class="form-card" data-testid="login-page">
  <h2>Sign In</h2>

  <form method="post" action="{{ url_for('auth.login') }}"
        data-testid="login-form" novalidate>

    <div class="form-group">
      <label for="login-email">Email address</label>
      <input
        type="email"
        id="login-email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
        data-testid="login-email"
      />
    </div>

    <div class="form-group">
      <label for="login-password">Password</label>
      <input
        type="password"
        id="login-password"
        name="password"
        placeholder="Your password"
        autocomplete="current-password"
        required
        data-testid="login-password"
      />
    </div>

    <button type="submit" class="btn btn-primary btn-block mt-2"
            data-testid="login-button">
      Sign In
    </button>
  </form>

  <p class="form-footer mt-2">
    Don't have an account?
    <a href="{{ url_for('auth.register') }}" data-testid="register-link">Register here</a>
  </p>
</div>
{% endblock %}
